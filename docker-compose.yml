# Production-style Compose. Everything runs in containers, hardened defaults.
#
# Required env (set in .env or shell):
#   DJANGO_SECRET_KEY, MC_RCON_PASSWORD, HOSTCRAFT_INITIAL_ADMIN_PASSWORD
#
# Behind a reverse proxy in real deployments (Caddy / nginx / Traefik); the panel
# itself binds 8000.

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: hostcraft-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [hostcraft]
    security_opt:
      - no-new-privileges:true

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: ${MC_CONTAINER_NAME:-hostcraft-minecraft}
    restart: unless-stopped
    ports:
      - "${MC_SERVER_PORT:-25565}:25565"
    environment:
      EULA: "${MC_EULA:-TRUE}"
      TYPE: "${MC_TYPE:-PAPER}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MC_MEMORY:-4G}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:?set MC_RCON_PASSWORD}"
      RCON_PORT: "${MC_RCON_PORT:-25575}"
    volumes:
      - mc-data:/data
    networks: [hostcraft]
    security_opt:
      - no-new-privileges:true
    labels:
      hostcraft.managed: "true"

  hostcraft:
    # Pulls the multi-arch image published by the CI workflow.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/e-scheer/hostcraft:${HOSTCRAFT_IMAGE_TAG:-latest}
    # build:
    #   context: .
    #   dockerfile: backend/Dockerfile
    container_name: hostcraft-panel
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${HOSTCRAFT_HTTP_PORT:-8080}:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,hostcraft}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}"
      DJANGO_LOG_LEVEL: "${DJANGO_LOG_LEVEL:-INFO}"
      HOSTCRAFT_DB_PATH: "/data/hostcraft.db"
      HOSTCRAFT_INITIAL_ADMIN_USER: "${HOSTCRAFT_INITIAL_ADMIN_USER:-admin}"
      HOSTCRAFT_INITIAL_ADMIN_PASSWORD: "${HOSTCRAFT_INITIAL_ADMIN_PASSWORD:?set HOSTCRAFT_INITIAL_ADMIN_PASSWORD}"
      MC_CONTAINER_NAME: "${MC_CONTAINER_NAME:-hostcraft-minecraft}"
      MC_RCON_HOST: "minecraft"
      MC_RCON_PORT: "${MC_RCON_PORT:-25575}"
      MC_RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      DOCKER_HOST: "tcp://docker-proxy:2375"
    volumes:
      - panel-data:/data
      - mc-data:/mc-data
      - hostcraft-backups:/backups
    networks: [hostcraft]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      - minecraft
      - docker-proxy

networks:
  hostcraft:
    driver: bridge

volumes:
  mc-data:
  panel-data:
  hostcraft-backups:
