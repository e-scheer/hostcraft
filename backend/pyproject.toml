[project]
name = "hostcraft-backend"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "DJ",            # django-specific
    "S",             # security (bandit)
    "RUF",           # ruff-specific
]
ignore = [
    "S101",  # asserts are fine in tests
    "S104",  # bind 0.0.0.0 (containers)
]

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["S105"]  # tolerate inline secret defaults guarded by env var
"**/tests/*" = ["S"]

[tool.ruff.format]
quote-style = "double"
