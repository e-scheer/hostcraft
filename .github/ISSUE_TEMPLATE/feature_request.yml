name: Feature request
description: Something the panel should do, doesn't yet.
title: "[feat] "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Heads up — hostcraft has a deliberately narrow scope. Out of scope (won't ship):
        - multi-tenant / multi-server hosting
        - user billing / payments
        - in-game ticketing or chat moderation

        See the README for what's in scope. If your idea falls outside, that's fine to file —
        but expect it to be politely closed rather than implemented.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain or limitation. Not the solution yet — the problem.
      placeholder: |
        Today, restoring a backup requires clicking through three confirms even when the server is offline.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: What would you like to see?
      description: Your suggested solution. Mock-ups, API shapes, command examples all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other workarounds you tried, other tools that do this well, things you ruled out.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Use case, scale (5 friends? 50?), engine/version that prompted this, etc.
