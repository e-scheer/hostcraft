name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----- Backend -----------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DEBUG: "false"
        run: python manage.py check
      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DEBUG: "false"
        run: python manage.py test --noinput --verbosity 2

  # ----- Frontend ----------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vue-tsc --noEmit
      - run: npm run build
      - name: i18n parity (en/fr key counts match)
        run: |
          python3 - <<'PY'
          import json, sys
          en = json.load(open('src/locales/en.json'))
          fr = json.load(open('src/locales/fr.json'))
          def keys(d, p=''):
              out = set()
              for k, v in d.items():
                  q = f'{p}.{k}' if p else k
                  out |= keys(v, q) if isinstance(v, dict) else {q}
              return out
          en_k, fr_k = keys(en), keys(fr)
          if en_k != fr_k:
              missing_in_fr = en_k - fr_k
              missing_in_en = fr_k - en_k
              print(f"locale parity FAILED. en={len(en_k)}, fr={len(fr_k)}")
              if missing_in_fr: print("missing in fr:", sorted(missing_in_fr)[:20])
              if missing_in_en: print("missing in en:", sorted(missing_in_en)[:20])
              sys.exit(1)
          print(f"locale parity OK ({len(en_k)} keys)")
          PY

  # ----- Docker image ------------------------------------------------------
  # Publish to GHCR on:
  #   - push to main         -> :main + :sha-<short>
  #   - tag v*               -> :vX.Y.Z + :latest
  # PRs build but do NOT push (no credentials, no pollution of the registry).
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hostcraft
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
